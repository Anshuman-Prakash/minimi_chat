<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Minimi Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Pixelify+Sans:wght@500;600&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">minimi<span>chat</span></div>
    <button id="new-chat" type="button"><span aria-hidden="true">+</span> New chat</button>
    <div class="label">Conversations</div>
    <nav id="conversations" aria-label="Past conversations"></nav>
  </aside>

  <main>
    <header class="topbar">
      <button id="menu" type="button" aria-label="Show conversations">☰</button>
      <div class="brand">minimi<span>chat</span></div>
    </header>

    <div id="messages" aria-live="polite"></div>

    <form id="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask anything, or ask what we talked about last Tuesday…" autofocus></textarea>
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <p class="hint">Searches the web when it needs to · remembers past conversations by date · Enter to send</p>
    </form>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
